apiVersion: v1alpha1
kind: Role
metadata:
  name: tinytraffic-role-view-stats
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "tinytraffic"
    rbac.authorization.halo.run/display-name: "查看访问统计"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:tinytraffic:stats:view"]
rules:
  - apiGroups: ["console.api.tinytraffic.halo.run"]
    resources: ["stats"]
    verbs: ["get"]
