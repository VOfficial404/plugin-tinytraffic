# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: tinytraffic
spec:
  enabled: true
  requires: ">=2.27.0"
  author:
    name: VOfficial404
    website: https://github.com/VOfficial404
  logo: logo.svg
  settingName: plugin-tinytraffic-settings
  configMapName: plugin-tinytraffic-configmap
  homepage: https://github.com/VOfficial404/plugin-tinytraffic#readme
  repo: https://github.com/VOfficial404/plugin-tinytraffic
  issues: https://github.com/VOfficial404/plugin-tinytraffic/issues
  displayName: "tinytraffic"
  description: "集成 tinytraffic 网站统计：自动注入统计脚本，并在控制台查看访问数据"
  pluginDependencies:
    PluginFeed?: ">=1.4.0"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/VOfficial404/plugin-tinytraffic/blob/main/LICENSE"
