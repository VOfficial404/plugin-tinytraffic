plugins {
    id 'java'
    id "com.diffplug.spotless" version "8.10.2"
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'io.github.vofficial404.tinytraffic'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    compileOnly 'run.halo.app:api'
    // Optional integration with the RSS plugin, see pluginDependencies in plugin.yaml
    compileOnly 'run.halo.feed:api:1.4.0'

    testImplementation 'run.halo.app:api'
    testImplementation 'run.halo.feed:api:1.4.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.27'
}

spotless {
    java {
        palantirJavaFormat("2.90.0").formatJavadoc(true)
    }
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

haloPlugin {
    openApi {
        // By default the docs are read from a temporary Halo container (needs Docker). Pass
        // -PuseExistingServer to read them from a Halo that already runs this plugin at halo.externalUrl.
        useExistingServer = project.hasProperty('useExistingServer')
        groupingRules {
            extensionApis {
                displayName = 'Extension API for tinytraffic'
                pathsToMatch = ['/apis/console.api.tinytraffic.halo.run/v1alpha1/**']
            }
        }
        groupedApiMappings = [
            '/v3/api-docs/extensionApis': 'extensionApis.json'
        ]
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}
